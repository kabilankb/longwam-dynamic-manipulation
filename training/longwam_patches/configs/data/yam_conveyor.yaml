# Unless required by applicable law or agreed to in writing, software
# distributed under the License is distributed on an "AS IS" BASIS,
# WITHOUT WARRANTIES OR CONDITIONS OF ANY KIND, either express or implied.
# See the License for the specific language governing permissions and
# limitations under the License.
# End Long-WAM attribution.

train:
  _target_: longwam.datasets.lerobot.robot_video_dataset.RobotVideoDataset
  dataset_dirs:
  - ${oc.env:LONGWAM_DATA_ROOT,./data}/yam_conveyor/dataset
  shape_meta:
    images:
    - key: top
      raw_shape:
      - 3
      - 240
      - 320
      shape:
      - 3
      - 224
      - 224
    - key: left_wrist
      raw_shape:
      - 3
      - 240
      - 320
      shape:
      - 3
      - 224
      - 224
    - key: right_wrist
      raw_shape:
      - 3
      - 240
      - 320
      shape:
      - 3
      - 224
      - 224
    action:
    - key: default
      raw_shape: 14
      shape: 14
    state:
    - key: default
      raw_shape: 14
      shape: 14
  num_frames: 81
  past_obs_size: 48
  action_chunk: 32
  global_sample_stride: 1
  action_video_freq_ratio: 4
  video_size:
  - 384
  - 320
  camera_key: null
  val_set_proportion: 0.02
  is_training_set: true
  pretrained_norm_stats: ${oc.env:LONGWAM_CHECKPOINT_ROOT,./checkpoints}/yam/dataset_stats.json
  skip_padding_as_possible: false
  concat_multi_camera: robotwin
  processor:
    _target_: longwam.datasets.lerobot.processors.longwam_processor.LongWAMProcessor
    shape_meta: ${data.train.shape_meta}
    num_obs_steps: ${data.train.num_frames}
    num_image_steps: 21   # = YAM checkpoint (81 frames sampled every 4th)
    num_output_cameras: 3
    action_output_dim: 14
    proprio_output_dim: 14
    action_state_transforms: null
    use_stepwise_action_norm: false
    norm_default_mode: z-score
    norm_exception_mode: null
    action_state_merger:
      _target_: longwam.datasets.lerobot.transforms.action_state_merger.ConcatLeftAlign
    train_transforms:
    - _target_: longwam.datasets.lerobot.transforms.image.ToTensor
    - _target_: torchvision.transforms.Resize
      size:
      - 224
      - 224
    val_transforms:
    - _target_: longwam.datasets.lerobot.transforms.image.ToTensor
    - _target_: torchvision.transforms.Resize
      size:
      - 224
      - 224
  text_embedding_cache_dir: ${oc.env:LONGWAM_DATA_ROOT,./data}/text_embeds_cache/yam_conveyor
  context_len: 128
  video_backend: pyav
  decode_only_sampled_video_frames: true   # 21 of 81 frames, as the YAM checkpoint was trained
