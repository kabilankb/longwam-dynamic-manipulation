# Long-WAM data config for the YAMLab ConveyorCubePick-v0 dataset (YAM bimanual, 30 Hz).
# Converted from yamlab6 by ~/longwam/yam_train/convert_yamlab_to_longwam.py: cameras renamed to
# top/left_wrist/right_wrist, gripper mapped to the ABC-130K 0..1 convention (1 = open).
# Image processing and normalization follow the Long-WAM-YAM checkpoint (224x224 per camera,
# robotwin 384x320 mosaic, the checkpoint's dataset_stats.json), not RoboTwin.
# Long-WAM file attribution; existing upstream notices are retained below.
